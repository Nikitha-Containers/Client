name: React CI

on:
  push:
    branches:
      - server

jobs:
  build:
    runs-on: ubantu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Code
        uses: action/setup-node@v4

      - name: Setup Node.js
        uses: action/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build
